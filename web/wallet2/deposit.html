<!DOCTYPE html>
<html>

<head>
  <title>Wallet - Depositar</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">

  <style>
    body {
      padding: 20px;
    }

    .container {
      max-width: 50%;
      margin: 0 auto;
      padding: 2px;
    }

    .h01 {
      background-color: blue;
      width: 100%;
      height: auto;
    }

    .balance-card {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      margin: 20px;
      padding: 20px;
      border-radius: 15px;
      color: white;
      box-shadow: 0 4px 15px rgba(118, 75, 162, 0.3);
    }

    .balance-title {
      font-size: 14px;
      opacity: 0.8;
    }

    .balance-amount {
      font-size: 32px;
      font-weight: bold;
      margin: 5px 0;
    }

    .card-number {
      font-family: monospace;
      font-size: 16px;
      margin-top: 15px;
      letter-spacing: 2px;
    }

    #card01 {
      padding: 0px;
      margin: 0px;
      border: 0;

    }
        #card02 {
      padding: 0px;
      margin: 0px;
      border: 0;

    }

    /* Asegura que todas las imágenes del carrusel tengan la misma altura */
    .carousel-item img {
      height: 225px;
      /* Puedes cambiar este número (ej. 400px o 500px) según qué tan alto lo quieras */
      object-fit: cover;
      /* ¡Esta es la magia! Recorta y acomoda la imagen para que no se deforme */
      object-position: center;
      /* Centra la imagen para que el recorte sea estético */
    }
   

    .card,
    .panel,
    .widget {
      container-type: inline-size;
    }

    @container (min-width: 500px) {}
  </style>
</head>

<body>
  <!-- Mantengo el menu -->

  <header class="container-fluid bg-primary">


    <nav class="navbar navbar-expand-lg bg-body-tertiary">
      <div class="container-fluid">
        <a class="navbar-brand" href="#">Billetera Digital</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNavAltMarkup"
          aria-controls="navbarNavAltMarkup" aria-expanded="false" aria-label="Toggle navigation">
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNavAltMarkup">
          <div class="navbar-nav">
            <a class="nav-link active" aria-current="page" href="menu.html">Home</a>
            <a class="nav-link" href="deposit.html">deposito</a>
            <a class="nav-link" href="sendmoney.html">Transferencias</a>
            <a class="nav-link" href="transactions.html">Ultimos Movimientos</a>
            <a class="nav-link" href="login.html">Cerrar sesion</a>


          </div>
        </div>
      </div>



    </nav>
  </header>



  <!-- Saldo disponible  Card-->
  <section class="container">
    <div class="row row-cols-6">
      <div class="card col" id="card01" style="width: 100%; max-width: 18rem;">
        <div class="card-body balance-card" data-account="current">
          <h5 class="card-title">Saldo Disponible</h5>
          <h6 class="card-subtitle mb-2 balance-title">Cuenta Corriente</h6>
          <p class="card-text card-number">... ... ... 4315</p>
          <hr>
          <div class="row align-items-start">
            <div class="col">
              <p class="card-text">Disponible.</p>
            </div>
            <div class="col text-end">
              <p class="card-text balance-amount" id="currentBalance">$600.000,00</p>
            </div>
          </div>
        </div>
      </div>
      <!-- Segunda Card  -->
      <div class="card col" id="card01" style="width: 100%; max-width: 18rem;">
        <div class="card-body balance-card" data-account="credit">
          <h5 class="card-title">Saldo Disponible</h5>
          <h6 class="card-subtitle mb-2 balance-title">Tarjeta de Crédito</h6>
          <p class="card-text card-number">... ... ... 9175</p>
          <hr>
          <div class="row align-items-start">
            <div class="col">
              <p class="card-text">Disponible.</p>
            </div>
            <div class="col text-end">
              <p class="card-text balance-amount" id="creditBalance">$4.800.725,00</p>
            </div>
          </div>
        </div>
      </div>
    </div>
  </section>

<!-- Card de deposito -->
<section class="container mt-4">
    <div class="card p-4" id="card02">
      <div class="row">
        <div class="col-12">
          <h2 class="mb-3">Depositar</h2>
        </div>
        <div class="col-12">
          <form id="depositForm">
            <div class="mb-3">
              <label for="accountSelect" class="form-label">Seleccionar cuenta:</label>
              <select class="form-control" id="accountSelect">
                <option value="current">Cuenta Corriente</option>
                <option value="credit">Tarjeta de Crédito</option>
              </select>
            </div>
            <div class="mb-3">
              <label for="depositAmount" class="form-label">Monto a depositar:</label>
              <!-- Cambiamos type="number" por type="text" -->
              <input type="text" class="form-control" id="depositAmount" placeholder="Ej: 10.000">
            </div>
            <button type="submit" class="btn btn-primary">Realizar depósito</button>
          </form>
          <div id="depositMessage" class="mt-3" aria-live="polite"></div>
        </div>
      </div>
    </div>
  </section>



  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
  <script src="Assets/js/proceso.js"></script>
  


</body>

</html>
