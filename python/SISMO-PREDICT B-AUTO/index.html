<!DOCTYPE html>
<html lang="en">

<head>
    <title></title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="css/style.css" rel="stylesheet">
</head>
<style>
    :root {
        --bg: #0b1220;
        --card: #111a2e;
        --line: #23304d;
        --text: #e6ecf7;
        --muted: #8fa1c0;
        --red: #ff4d4d;
        --blue: #3aa0ff;
        --green: #2ecc71;
        --orange: #ff9f43;
        --violet: #a29bfe;
    }

    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0
    }

    body {
        background: var(--bg);
        color: var(--text);
        font-family: Segoe UI, Roboto, Arial;
        min-height: 100vh
    }

    header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 14px 22px;
        border-bottom: 1px solid var(--line);
        background: #0d1526;
        flex-wrap: wrap;
        gap: 10px
    }

    header h1 {
        font-size: 20px
    }

    header h1 span {
        color: var(--orange)
    }

    .dot {
        width: 10px;
        height: 10px;
        border-radius: 50%;
        background: var(--green);
        display: inline-block;
        margin-right: 6px
    }

    button {
        background: var(--violet);
        border: none;
        color: #08101f;
        padding: 7px 12px;
        border-radius: 8px;
        cursor: pointer;
        font-weight: 600;
        transition: transform .1s
    }

    button:hover {
        transform: translateY(-1px)
    }

    .banner {
        padding: 10px 22px;
        background: rgba(255, 77, 77, .15);
        color: var(--red);
        border-bottom: 1px solid var(--line);
        font-weight: 700;
        display: none
    }

    .banner.on {
        display: block
    }

    main {
        display: grid;
        grid-template-columns: 2fr 1fr;
        gap: 14px;
        padding: 14px
    }

    .card {
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 12px;
        padding: 14px
    }

    #map {
        height: 560px;
        border-radius: 10px
    }

    .side {
        display: flex;
        flex-direction: column;
        gap: 14px
    }

    h3 {
        font-size: 13px;
        color: var(--muted);
        margin-bottom: 10px;
        text-transform: uppercase;
        letter-spacing: .5px
    }

    .badge {
        padding: 3px 8px;
        border-radius: 6px;
        font-size: 11px;
        font-weight: 700;
        white-space: nowrap
    }

    .red {
        background: rgba(255, 77, 77, .15);
        color: var(--red)
    }

    .blue {
        background: rgba(58, 160, 255, .15);
        color: var(--blue)
    }

    .green {
        background: rgba(46, 204, 113, .15);
        color: var(--green)
    }

    .gray {
        background: rgba(150, 150, 150, .15);
        color: #aaa
    }

    .row {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 8px 0;
        border-bottom: 1px dashed var(--line);
        gap: 8px
    }

    .row:last-child {
        border-bottom: none
    }

    .row small {
        color: var(--muted);
        display: block;
        margin-top: 2px
    }

    table {
        width: 100%;
        border-collapse: collapse;
        font-size: 12px
    }

    th,
    td {
        padding: 7px 8px;
        text-align: left;
        border-bottom: 1px solid var(--line)
    }

    th {
        color: var(--muted);
        font-weight: 600;
        position: sticky;
        top: 0;
        background: var(--card)
    }

    #charts {
        grid-column: 1/-1;
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
        gap: 14px
    }

    canvas {
        max-height: 180px
    }

    .note {
        font-size: 11px;
        color: var(--muted);
        margin-top: 8px;
        line-height: 1.4
    }

    .controls {
        margin-top: 10px;
        display: flex;
        gap: 14px;
        flex-wrap: wrap;
        font-size: 12px;
        color: var(--muted);
        padding: 8px;
        background: #0d1526;
        border-radius: 8px;
        border: 1px solid var(--line)
    }

    .controls label {
        display: inline-flex;
        align-items: center;
        gap: 4px;
        cursor: pointer
    }

    .controls input {
        accent-color: var(--violet)
    }

    .controls .sep {
        color: #444;
        user-select: none
    }

    .pred-section {
        grid-column: 1/-1
    }

    .pred-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
        gap: 12px
    }

    .pred {
        background: #0d1526;
        border: 1px solid var(--line);
        border-left: 3px solid var(--violet);
        border-radius: 8px;
        padding: 12px;
        transition: transform .15s, box-shadow .15s
    }

    .pred:hover {
        transform: translateY(-2px);
        box-shadow: 0 4px 14px rgba(162, 155, 254, .15)
    }

    .pred-head {
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        gap: 8px;
        margin-bottom: 6px
    }

    .pred-head b {
        font-size: 14px
    }

    .pred .f {
        font-size: 12px;
        color: var(--muted);
        display: block;
        margin-top: 3px
    }

    .pred .f b {
        color: var(--text);
        font-weight: 600
    }

    .table-wrap {
        max-height: 360px;
        overflow: auto;
        border-radius: 8px;
        border: 1px solid var(--line)
    }

    .loading {
        padding: 40px;
        text-align: center;
        color: var(--muted);
        font-size: 14px
    }

    .duo {
        display: grid;
        grid-template-columns: 1.2fr 1fr;
        gap: 12px;
        margin-top: 12px
    }

    #minimap {
        height: 230px;
        border-radius: 10px;
        border: 1px solid var(--line)
    }

    .iss-box {
        background: #0d1526;
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 10px
    }

    .live-dot {
        width: 9px;
        height: 9px;
        border-radius: 50%;
        background: var(--red);
        display: inline-block;
        margin-right: 6px;
        animation: pulse 1.2s infinite
    }

    @keyframes pulse {
        0% {
            opacity: 1
        }

        50% {
            opacity: .25
        }

        100% {
            opacity: 1
        }
    }

    .trio {
        display: grid;
        grid-template-columns: 1fr 1fr 1fr;
        gap: 12px;
        margin-top: 14px
    }

    .trio canvas {
        width: 100%;
        height: 240px;
        background: #0d1526;
        border: 1px solid var(--line);
        border-radius: 10px
    }

    .plate-label {
        background: transparent !important;
        border: none !important
    }

    .falla-label {
        background: transparent !important;
        border: none !important
    }

    @media (max-width: 1024px) {
        main {
            grid-template-columns: 1fr
        }

        #map {
            height: 450px
        }

        .duo {
            grid-template-columns: 1fr
        }

        .trio {
            grid-template-columns: 1fr
        }
    }

    @media (max-width: 640px) {
        header {
            padding: 12px 14px
        }

        header h1 {
            font-size: 16px
        }

        main {
            padding: 10px;
            gap: 10px
        }

        #map {
            height: 360px
        }

        .pred-grid {
            grid-template-columns: 1fr
        }

        .controls {
            font-size: 11px;
            gap: 10px
        }
    }

    .falla-nombre {
        color: #ff8080;
        font-size: 10px;
        font-weight: bold;
        text-shadow: 1px 1px 2px #000, -1px -1px 2px #000;
        white-space: nowrap;
        text-align: center;
        pointer-events: none
    }

    .legend {
        background: #0d1526;
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 8px 10px;
        color: var(--text);
        font-size: 11px;
        line-height: 1.7
    }

    .lg-line {
        width: 18px;
        height: 3px;
        display: inline-block;
        margin-right: 6px;
        vertical-align: middle
    }

    .lg-hatch {
        width: 18px;
        height: 12px;
        display: inline-block;
        margin-right: 6px;
        vertical-align: middle;
        border: 1px solid #666
    }
</style>

<body>
    <p class="perro">perro amigo</p>
</body>

</html>
