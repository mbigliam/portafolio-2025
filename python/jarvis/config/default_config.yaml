# =============================================================================
# JARVIS DESKTOP AI - CONFIGURACIÓN DEL SISTEMA
# =============================================================================

system:
  name: "JARVIS"
  version: "1.0.0"
  language: "es-ES"
  debug_mode: true
  start_with_windows: false

ui:
  window_title: "J.A.R.V.I.S. // Desktop Core Interface"
  theme: "hologram_cyan"
  fullscreen: false
  width: 1280
  height: 800
  fps: 60
  particle_count: 60
  glow_intensity: 1.0

voice:
  enabled: true
  wake_word: "JARVIS"
  stt_engine: "google_speech"
  tts_engine: "edge_tts"
  voice_id: "es-ES-AlvaroNeural"
  rate: 1.0
  volume: 1.0

ai:
  enabled: true
  provider: "ollama"
  model: "tinyllama"        # O "llama3.2", "gemma2:2b", etc.
  base_url: "http://localhost:11434"
  api_key: "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIL0gF3HdfGH/0Nct0SvGLYkP8bQsu6Mvg2r9VZSNDK6u"                # Ollama no necesita API key
  temperature: 0.7
  max_tokens: 350

security:
  policy_level: "MEDIUM" # LOW | MEDIUM | HIGH | CRITICAL
  ask_confirmation_for_destructive: true

logging:
  level: "DEBUG"
  file: "logs/application.log"